# NOTE: not tested in the authoring environment (no Docker available). Treat as a starting point.
# The app itself was verified against PostgreSQL 16.4 (237 tests, Alembic, full demo flow) using portable binaries, see README.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: talentiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentiq}
      POSTGRES_DB: talentiq
    volumes: [ "talentiq-pg:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U talentiq" ]
      interval: 5s
      retries: 10
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://talentiq:${POSTGRES_PASSWORD:-talentiq}@db:5432/talentiq
      UPLOAD_DIR: /data/uploads
      API_KEY: ${API_KEY:-}
    volumes: [ "talentiq-data:/data" ]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: [ "8080:80" ]
    depends_on: [ backend ]
volumes:
  talentiq-data:
  talentiq-pg:
